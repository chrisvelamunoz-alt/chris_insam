<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <link rel="stylesheet" href="estilos.css"> </head>
</head>
<body>
    <h1>Calculadora PHP</h1>
    <form id="calculatorForm">
        <label for="num1">Número 1:</label><br>
        <input type="text" id="num1" name="num1"><br><br>

        <label for="num2">Número 2:</label><br>
        <input type="text" id="num2" name="num2"><br><br>

        <button type="submit" name="operacion" value="suma">Sumar</button>
        <button type="submit" name="operacion" value="resta">Restar</button>
        <button type="submit" name="operacion" value="multiplicacion">Multiplicar</button>
        <button type="submit" name="operacion" value="division">Dividir</button>
        <button type="reset" id="clearButton">Limpiar</button>
    </form>

    <div id="resultado">
    </div>

    <script>
        document.getElementById('calculatorForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Evita el envío normal del formulario

            const form = event.target;
            const formData = new FormData(form); // Crea un objeto FormData con los datos del formulario

            // Agregar el valor del botón presionado a FormData
            // Usaremos un evento de click para saber qué botón fue presionado
            let clickedButtonValue = event.submitter.value;
            formData.append('operacion', clickedButtonValue);

            fetch('calculadora.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text()) // Espera la respuesta como texto
            .then(data => {
                document.getElementById('resultado').innerHTML = '<h2>Resultado:</h2><p>' + data + '</p>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('resultado').innerHTML = '<h2>Error:</h2><p>Hubo un problema al realizar la operación.</p>';
            });
        });

        // Agrega un escuchador de eventos para el botón "Limpiar"
        document.getElementById('clearButton').addEventListener('click', function() {
            document.getElementById('resultado').innerHTML = ''; // Limpia el contenido del div de resultado
        });
    </script>
</body>
</html>
